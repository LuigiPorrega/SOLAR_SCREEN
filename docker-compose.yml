version: "3.8"

services:
  mariadb:
    build:
      context: ./initdb
      dockerfile: Dockerfile
    restart: always
    container_name: luigi-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: solvam
      MARIADB_DATABASE: solar_screen
      MARIADB_INIT_SCRIPTS_ALWAYS_EXECUTE: "true"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - solvam

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    container_name: luigi-phpmyadmin
    environment:
      PMA_HOST: luigi-mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: solvam
      MYSQL_ROOT_PASSWORD: solvam
    networks:
      - solvam
    depends_on:
      - mariadb

  codeigniter:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luigi-backend
    volumes:
      - ./backend:/var/www/html:cached  # Código fuente
      # No montamos writable desde host, se crea dentro del contenedor
    expose:
      - "80"
    depends_on:
      - mariadb
    networks:
      - solvam

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luigi-frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    depends_on:
      - codeigniter
    networks:
      - solvam

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: always
    container_name: nginx-proxy-manager
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - solvam

networks:
  solvam:
    driver: bridge

volumes:
  mariadb_data:
  frontend_node_modules:
